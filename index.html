<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
if (sessionStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>

<style>
.center-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 10px;
}

.card {
    width: 100%;
    max-width: 650px;
}

#canvas-container {
    width: 100%;
    height: 50vh;
    max-height: 400px;
}

canvas {
    display: block;
}

@media (max-width: 768px) {
    .grid-3 {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="center-wrapper">

<div class="card">
<h2 class="text-center">Cupboard Designer (Real Cut System)</h2>

<div class="grid grid-3 mt-2">

<!-- DIMENSIONS -->
<div class="form-group">
<label>Width (mm)</label>
<input type="number" id="width" value="2000">
</div>

<div class="form-group">
<label>Height (mm)</label>
<input type="number" id="height" value="2200">
</div>

<div class="form-group">
<label>Depth (mm)</label>
<input type="number" id="depth" value="600">
</div>

<div class="form-group">
<label>Panel Thickness (mm)</label>
<input type="number" id="thickness" value="18">
</div>

<div class="form-group">
<label>Number of Shelves</label>
<input type="number" id="shelves" value="2">
</div>

<div class="form-group">
<label>Back Thickness (mm)</label>
<input type="number" id="back" value="6">
</div>

</div>

<button class="btn btn-primary mt-2" onclick="updateCabinet(); generateCutList();">
Update
</button>
</div>

<div class="card mt-3">
<div id="canvas-container"></div>
</div>

<div class="card mt-3">
<h3>Cut List (Wood Pieces)</h3>
<div id="cutList"></div>
</div>

</div>

<button class="btn btn-danger logout-btn" onclick="logout()">Logout</button>

<script>
let scene, camera, renderer, controls;
let parts = [];

/* =========================
INIT
========================= */
function init3D() {
    const container = document.getElementById("canvas-container");

    const w = container.clientWidth;
    const h = container.clientHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    camera = new THREE.PerspectiveCamera(75, w / h, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;

    buildCabinet();

    window.addEventListener("resize", () => {
        const w = container.clientWidth;
        const h = container.clientHeight;

        camera.aspect = w / h;
        camera.updateProjectionMatrix();

        renderer.setSize(w, h);
    });

    animate();
}

/* ========================= */
function clearCabinet() {
    parts.forEach(p => scene.remove(p));
    parts = [];
}

/* =========================
BUILD CABINET (mm → meters)
========================= */
function buildCabinet() {
    clearCabinet();

    const Wmm = parseFloat(document.getElementById("width").value);
    const Hmm = parseFloat(document.getElementById("height").value);
    const Dmm = parseFloat(document.getElementById("depth").value);
    const Tmm = parseFloat(document.getElementById("thickness").value);
    const shelves = parseInt(document.getElementById("shelves").value);
    const backTmm = parseFloat(document.getElementById("back").value);

    const W = Wmm / 1000;
    const H = Hmm / 1000;
    const D = Dmm / 1000;
    const T = Tmm / 1000;
    const backT = backTmm / 1000;

    const wood = 0x8b5a2b;

    addBox(T, H, D, -W/2 + T/2, 0, 0, wood);
    addBox(T, H, D, W/2 - T/2, 0, 0, wood);

    addBox(W, T, D, 0, H/2 - T/2, 0, wood);
    addBox(W, T, D, 0, -H/2 + T/2, 0, wood);

    addBox(W, H, backT, 0, 0, -D/2, 0x5a3a1a);

    for (let i = 1; i <= shelves; i++) {
        const y = -H/2 + (H / (shelves + 1)) * i;
        addBox(W - 2*T, T, D * 0.95, 0, y, 0, wood);
    }

    updateCamera(W, H, D);
}

/* ========================= */
function addBox(w, h, d, x, y, z, color) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);

    scene.add(mesh);
    parts.push(mesh);
}

/* ========================= */
function updateCamera(w, h, d) {
    const max = Math.max(w, h, d);

    camera.position.set(max * 2, max * 1.5, max * 2);
    camera.lookAt(0, 0, 0);

    controls.target.set(0, 0, 0);
    controls.update();
}

/* ========================= */
function updateCabinet() {
    buildCabinet();
}

/* =========================
CUT LIST (mm)
========================= */
function generateCutList() {
    const W = parseFloat(document.getElementById("width").value);
    const H = parseFloat(document.getElementById("height").value);
    const D = parseFloat(document.getElementById("depth").value);
    const T = parseFloat(document.getElementById("thickness").value);
    const shelves = parseInt(document.getElementById("shelves").value);
    const backT = parseFloat(document.getElementById("back").value);

    const internalWidth = W - (2 * T);

    let list = [];

    list.push({ name: "Side Panel", w: D, h: H, t: T, qty: 2 });
    list.push({ name: "Top/Bottom Panel", w: W, h: D, t: T, qty: 2 });
    list.push({ name: "Back Panel", w: W, h: H, t: backT, qty: 1 });

    if (shelves > 0) {
        list.push({
            name: "Shelf",
            w: internalWidth,
            h: D,
            t: T,
            qty: shelves
        });
    }

    const container = document.getElementById("cutList");
    container.innerHTML = "";

    list.forEach(item => {
        const div = document.createElement("div");

        div.style.padding = "5px 0";
        div.style.borderBottom = "1px solid #ccc";

        div.innerText =
            `${item.name} | ${item.qty}x | ` +
            `${item.w}mm × ${item.h}mm × ${item.t}mm`;

        container.appendChild(div);
    });
}

/* ========================= */
function logout() {
    sessionStorage.removeItem("loggedIn");
    window.location.href = "login.html";
}

/* ========================= */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

init3D();
generateCutList();
</script>

</body>
</html>
