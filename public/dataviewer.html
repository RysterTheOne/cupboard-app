<!DOCTYPE html>
    <html lang="en">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgb(0, 0, 0, 0);
        }

        th, td {
            border: 0,0,1px,0 solid #000000;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }

        tr:hover {
            background: #85a5bcb0;
        }
    </style>

    <head>
        <title>Database Viewer</title>
    </head>

    <body>
        <div class="center-wrapper">

            <!-- CREATE USER -->
            <div class="card">
                <h3>Database Viewer</h3>

                <div class="grid grid-3 mt-2">
                    <div class="form-group">
                        <label>Table</label>
                        <select id="tableSelect"></select>
                    </div>

                    <div class="form-group">
                        <label>Load Table</label>
                        <button onclick="loadTable()">Load</button>
                    </div>

                    <div class="form-group">
                        <label>Refresh Table</label>
                        <button onclick="refresh()">Refresh</button>
                    </div>
                </div>
            </div>

            <!-- USER LIST (same width automatically via card) -->
            <div class="card mt-3">
                <h3>Table</h3>
                <table>
                    <thead>
                        <tr id="tableHead"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

        </div>

        <script>
        const API = "https://cupboard-app.onrender.com"; // 🔥 CHANGE THIS

        // Load table names
        async function loadTables() {
            try {
                const res = await fetch(API + "/api/admin/tables", {
                    credentials: "include"
                });

                const text = await res.text();
                console.log("RAW RESPONSE:", text);

                const tables = JSON.parse(text); // ✅ FIX

                const select = document.getElementById("tableSelect");
                select.innerHTML = "";

                tables.forEach(t => {
                    const option = document.createElement("option");
                    option.value = t.table_name;
                    option.innerText = t.table_name;
                    select.appendChild(option);
                });

            } catch (err) {
                console.error(err);
                alert("Failed to load tables");
            }
        }

        // Load selected table
        async function loadTable() {
            const table = document.getElementById("tableSelect").value;

            if (!table) return;

            try {
                const res = await fetch(API + "/api/admin/table/" + table, {
                    credentials: "include"
                });

                const data = await res.json();

                const head = document.getElementById("tableHead");
                const body = document.getElementById("tableBody");

                head.innerHTML = "";
                body.innerHTML = "";

                if (!data.length) {
                    body.innerHTML = "<tr><td>No data</td></tr>";
                    return;
                }

                // Create headers
                Object.keys(data[0]).forEach(key => {
                    const th = document.createElement("th");
                    th.innerText = key;
                    head.appendChild(th);
                });
                const th = document.createElement("th");
                th.innerText = "Actions";
                head.appendChild(th);

                // Create rows
                data.forEach(row => {
                    const tr = document.createElement("tr");

                    Object.values(row).forEach(val => {
                        const td = document.createElement("td");

                        if (typeof val === "object" && val !== null) {
                            td.innerText = JSON.stringify(val);
                        } else {
                            td.innerText = val;
                        }

                        tr.appendChild(td);
                    });

                    // 🔥 DELETE BUTTON CELL
                    const deleteTd = document.createElement("td");
                    const btn = document.createElement("button");

                    btn.innerText = "Delete";
                    btn.style.background = "red";
                    btn.style.color = "white";
                    btn.style.border = "none";
                    btn.style.padding = "5px";

                    btn.onclick = async () => {
                        const table = document.getElementById("tableSelect").value;

                        if (!confirm("Delete this row?")) return;

                        await fetch(`${API}/api/admin/table/${table}/${row.id}`, {
                            method: "DELETE",
                            credentials: "include"
                        });

                        loadTable(); // refresh
                    };

                    deleteTd.appendChild(btn);
                    tr.appendChild(deleteTd);

                    body.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                alert("Failed to load table data");
            }
        }

        // Refresh current table
        function refresh() {
            loadTable();
        }

        // Init
        loadTables();
        </script>

    </body>
</html>
