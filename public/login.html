<!DOCTYPE html>
    <html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
        
    <head>
        <title>Login</title>
    </head>

    <body>
        <div class="top-bar fade-in">
            <div class="top-left" id="TopBtns" style="display: none;">
                <button class="btn btn-primary" style="display: none;"></button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right" id="TopBtns" style="display: none;">
                <button class="btn btn-danger" style="display: none;"></button>
            </div>
        </div>

        <div class="center-class fade-in">
            <div id="OfflineScreen">
                <div class="card">
                    <div class="title-card">ALERT</div>

                    <div class="content-columns">
                        <div class="img-sleep">
                            <img src="SleepWthoutBg.png" style="height: 100%; width: 100%; margin: 0px; padding: 0px;">
                        </div>

                        <div class="content-row">
                            <font color="Red" size="16px">Server Offline</font>
                        </div>
                    </div>
                </div>
            </div>

            <div id="Main">
                <div class="card">
                    <div class="title-card">
                        Login
                    </div>

                    <div class="content-columns">
                        <div class="content-row">
                            <div class="labels">Username</div>
                            <input class="inputs" type="text" id="username">
                        </div>

                        <div class="content-row">
                            <div class="labels">Password</div>
                            <input class="inputs" type="password" id="password">
                        </div>

                        <div class="content-row">
                            <button class="btn btn-primary content-btn" style="width: 90%;" onclick="login()">Login</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            
            waitForServer();

            async function login() {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                const res = await fetch(API + "/api/login", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = "dashboard.html";
                } else {
                    alert("Login failed");
                }
            }

            async function checkAuth2() {
                try {
                    const res = await fetch(API + "/api/me", {
                        credentials: "include"
                    });

                    const data = await res.json();

                    if (data || data.userId) {
                        window.location.href = "dashboard.html"
                    }
                } catch (err) {
                    return;
                }
            }

            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            async function AuthLoop() {
                while (true) {
                    await sleep(2000);
                    checkAuth2();
                };
            }
            AuthLoop();
        </script>
    </body>
</html>
