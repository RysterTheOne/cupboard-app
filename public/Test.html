<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

    <head>
        <title>Test Designer</title>
    </head>

    <body>
        <div id="canvas-container" style="width: 100vw; height: 100vh;"></div>

        <script>
            let scene, camera, renderer, controls;

            function init3D() {
                const container = document.getElementById("canvas-container");

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0f172a);

                // Fallback size if container is empty
                const width = container.clientWidth || window.innerWidth;
                const height = container.clientHeight || window.innerHeight;

                camera = new THREE.PerspectiveCamera(
                    75,
                    width / height,
                    0.1,
                    1000
                );

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(width, height);

                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enablePan = false;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(5, 10, 5);
                scene.add(dirLight);

                const mtlLoader = new THREE.MTLLoader();
                mtlLoader.load("Crusher.mtl", (materials) => {

                    materials.preload();
                    // LOAD OBJ
                    const objLoader = new THREE.OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.load("BlockStuff/Crusher.png.obj", (object) => {
                        scene.add(object);
                        object.position.set(0, 0, 0);
                        object.scale.set(1, 1, 1);
                        updateCamera(5, 5, 5);
                    });

                });

                animate();

                // Resize support
                window.addEventListener("resize", onResize);
            }

            function updateCamera(w, h, d) {
                const max = Math.max(w, h, d);

                camera.position.set(max * 2, max * 1.5, max * 2);

                controls.target.set(0, 0, 0);
                controls.update();
            }

            function onResize() {
                const container = document.getElementById("canvas-container");

                const width = container.clientWidth || window.innerWidth;
                const height = container.clientHeight || window.innerHeight;

                camera.aspect = width / height;
                camera.updateProjectionMatrix();

                renderer.setSize(width, height);
            }

            function animate() {
                requestAnimationFrame(animate);

                controls.update();
                renderer.render(scene, camera);
            }

            init3D();
        </script>
    </body>
</html>
