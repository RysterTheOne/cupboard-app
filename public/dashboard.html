<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="createProjectModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);" class="mid">

        <div class="card">
        
            <h3>Create Project</h3>

            <!-- Name field -->
            <input 
                type="text" 
                id="projectName" 
                placeholder="Enter name" 
                class="btn btn-primary"
            >

            <!-- Type dropdown -->
            <select class="btn btn-primary" id="projectType">
                <option value="shelving">Shelving</option>
                <option value="base_cabinet">Base Cabinet</option>
            </select>

            <!-- Buttons -->
            <div style="display: flex; justify-content: space-between;">
                <button class="btn btn-danger" onclick="hideCreateProject()">Cancel</button>
                <button class="btn btn-primary">Create</button>
            </div>

        </div>
    </div>
<!-- TOP BAR -->
<div class="top-bar">
    <button class="btn btn-primary" onclick="goAccounts()">Accounts -></button>
</div>

<div class="center-wrapper">
    <div class="card">
        <h2>Saved Projects</h2>

        <button class="btn btn-primary" onclick="showCreateProject()">+ New Project</button>

        <div id="projects" class="mt-2"></div>
    </div>
</div>

<button class="btn btn-danger logout-btn" onclick="logout()">Logout</button>

<script>
const API = "https://cupboard-app.onrender.com";

async function checkAuth() {
    try {
        const res = await fetch(API + "/api/me", {
            credentials: "include"
        });

        const data = await res.json();

        if (!data || !data.userId) {
            window.location.href = "login.html";
        }
    } catch (err) {
        window.location.href = "login.html";
    }
}
checkAuth();

async function loadProjects() {
    const res = await fetch(API + "/api/projects", {
        credentials: "include"
    });

    const projects = await res.json();

    const container = document.getElementById("projects");
    container.innerHTML = "";

    projects.forEach(p => {
        const div = document.createElement("div");
        div.className = "card mt-1";
        div.style.cursor = "pointer";

        div.innerText = p.name + " (click to open)";
        div.onclick = () => {
            localStorage.setItem("currentProject", p.data);
            window.location.href = "index.html";
        };

        container.appendChild(div);
    });
}

function goAccounts() {
    window.location.href = "admin.html";
}

function showCreateProject() {
    document.getElementById("createProjectModal").style.display = "flex"
}

function hideCreateProject() {
  document.getElementById("createProjectModal").style.display = "none";
}

async function createProject() {
  const name = document.getElementById("projectName").value;
  const type = document.getElementById("projectType").value;

  if (!name) {
    alert("Please enter a name");
    return;
  }

  try {
    const data = {
        name: name,
        cabinet_type: type,

        width: width.value,
        height: height.value,
        depth: depth.value,
        thickness: thickness.value,
        shelves: shelves.value,
        back: back.value
    };

    await fetch(API + "/api/projects", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "include",
        body: JSON.stringify({
            data
        })
    });

    if (!res.ok) {
      throw new Error("Failed to create user");
    }

    alert("User created!");
    hideCreateProject();

  } catch (err) {
    console.error(err);
    alert("Error creating user");
  }
}



function newProject() {
    localStorage.removeItem("currentProject");
    window.location.href = "index.html";
}

async function logout() {
    await fetch(API + "/api/logout", {
        method: "POST",
        credentials: "include"
    });

    // force clear UI state
    window.location.href = "login.html";
}

loadProjects();
</script>

</body>
</html>
