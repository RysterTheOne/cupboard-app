<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
        
    <style>
        .center-wrapper {
            min-height: calc(92vh);
        }

        #projects {
            flex-direction: column;
            align-items: center;
            background: rgba(21, 30, 43, 0.85);
            overflow-y: scroll;
            scrollbar-color: #888888 #00000000;
            padding: 5%;
            border-radius: 16px;
        }

        #projectBtn:hover {
            background: rgba(88, 123, 180, 0.85);
        }

        .labels {
            height: calc((72.25vh - 20px)*15/100);
            background: rgba(64, 105, 173, 0.85);
            padding: 14px;
        }

        @media (max-width: 768px) {
            .labels {
                height: calc(((72.25vh - 20px)*15/100)/2);
                padding: 14px;
            }
        }
    </style>

    <head>
        <title>Dashboard</title>
    </head>
    
    <body>

        <div id="createProjectModal" class="center-wrapper fade-in" style="display: none; background: rgba(0,0,0,0.5); height: 100vh;width: 100vw;">

            <div class="card">
                <table>
                    <tr>
                        <th colspan="4" align="center"><h1>Create Project</h1></th>
                    </tr>

                    <tr><td colspan="4" align="center"><h3 style="color: beige;">Project Name</h3></td></tr>

                    <tr>
                        <td colspan="4" align="center">
                            <!-- Name field -->
                            <input 
                                type="text" 
                                id="projectName" 
                                placeholder="Enter name" 
                                class="btn btn-primary"
                                style="background: azure; color: black;"
                            >
                        </td>
                    </tr>

                    <tr><td colspan="4" align="center"><h3 style="color: beige; padding-top: 7px;">Project Type</h3></td></tr>

                    <tr>
                        <td colspan="4" align="center">
                            <!-- Type dropdown -->
                            <select class="btn btn-primary" id="projectType" style="background: azure;  color: black;">
                                <option value="" disabled selected></option>
                                <option value="shelving">Shelving</option>
                                <option value="base_cabinet">Base Cabinet</option>
                                <option value="wall_cabinet">Wall Cabinet</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="4">
                            <!-- Buttons -->
                            <div style="display: flex; justify-content: space-between; padding-top: 15px;">
                                <button class="btn btn-danger" onclick="hideCreateProject()">Cancel</button>
                                <button class="btn btn-primary" onclick="createProject()">Create</button>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div class="top-bar" id="top">
            <div class="top-left">
                <button class="btn btn-primary" onclick="goAccounts()">Accounts</button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="main-page" class="center-class fade-in">
            <div class="card">
                <div class="center-title-card">
                    <div class="title-card">Saved Projects</div>
                </div>

                <div id="projects" class="content-columns">
                    <!--Projects generate in here later with loadProjects()-->
                </div>
            </div>
        </div>

        <script>
            async function loadProjects() {
                const res = await fetch(API + "/api/projects", {
                    credentials: "include"
                });

                const projects = await res.json();

                const container = document.getElementById("projects");
                container.innerHTML = "";

                const newProj = document.createElement("button");
                newProj.className = "btn btn-primary";
                newProj.onclick = () => {
                    document.getElementById("createProjectModal").style.display = "flex";
                    document.getElementById("top").style.display = "none";
                    document.getElementById("main-page").style.display = "none";
                };
                newProj.style.width = "95%"
                newProj.innerText = "New Project"
                container.appendChild(newProj)

                projects.forEach(p => {

                    const div = document.createElement("div");
                    div.className = "labels";
                    div.style.width = "90%"
                    div.style.cursor = "pointer";
                    div.style.display = "flex";
                    div.style.flexDirection = "row";
                    div.style.justifyContent = "space-between";
                    div.id = "projectBtn";

                    div.onclick = () => {
                        localStorage.setItem("currentProject", JSON.stringify(p));
                        window.location.href = "index.html";
                    };

                    // Project name (clickable)
                    const name = document.createElement("span");
                    name.style.display = "flex"
                    name.style.alignContent = "center";
                    name.innerText = p.name;

                    // Delete button
                    const delBtn = document.createElement("button");
                    delBtn.innerText = "Delete";
                    delBtn.className = "btn btn-danger"
                    delBtn.style.marginLeft = "5px";

                    delBtn.onclick = async (e) => {
                        e.stopPropagation(); // 🚨 prevents triggering open

                        if (!confirm("Delete this project?")) return;

                        try {
                            const res = await fetch(API + "/api/projects/" + p.id, {
                                method: "DELETE",
                                credentials: "include"
                            });

                            if (!res.ok) throw new Error("Delete failed");

                            // Reload list after delete
                            loadProjects();

                        } catch (err) {
                            console.error(err);
                            alert("Failed to delete project");
                        }
                    };
                    
                    
                    div.appendChild(name);
                    div.appendChild(delBtn);
                    container.appendChild(div);
                });
            }
            loadProjects();

            function goAccounts() {
                window.location.href = "admin.html";
            }

            function hideCreateProject() {
                document.getElementById("createProjectModal").style.display = "none";
                document.getElementById("top").style.display = "flex";
                document.getElementById("main-page").style.display = "flex";
            }

            async function createProject() {
                const name = document.getElementById("projectName").value
                const type = document.getElementById("projectType").value
                
                if (!name) {
                    alert("Please enter a name");
                    return;
                }

                try {
                    const data = {
                        cabinet_type: type,
                    };

                    await fetch(API + "/api/projects", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify({
                            name: name,
                            data
                        })
                    });

                    alert("Project created!");
                    localStorage.removeItem("currentProject");
                    localStorage.setItem("currentProject", JSON.stringify({name: name,data}))
                    window.location.href = "index.html";

                } catch (err) {
                    console.error(err);
                    alert("Error creating project");
                }
            }

            checkAuth();
        </script>
    </body>
</html>
