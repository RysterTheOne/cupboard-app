<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
        
    <style>
        #projectBtn:hover {
            background: rgba(88, 123, 180, 0.85);
        }
    </style>

    <head>
        <title>Dashboard</title>
    </head>
    
    <body>
        
        <div class="top-bar" id="top">
            <div class="top-left" name="TopBtns">
                <button class="btn btn-primary" onclick="goAccounts()">Accounts</button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right" name="TopBtns">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="center-class fade-in">
            <div id="createProjectModal" style="display: none;">
                <div class="card">
                    <div class="title-card">Create Project</div>
                    
                    <div class="content-columns" style="justify-content: center;">
                        <div class="content-row">
                            <div class="labels">Project Name</div>
                        <input class="inputs" type="text" id="projectName">
                        </div>

                        <div class="content-row">
                            <div class="labels">Preset</div>
                            <select class="inputs" id="projectType">
                                <option value="" disabled selected></option>
                                <option value="shelving">Shelving</option>
                                <option value="base_cabinet">Base Cabinet</option>
                                <option value="wall_cabinet">Wall Cabinet</option>
                            </select>
                        </div>

                        <div class="content-row">
                            <button class="labels btn btn-danger" onclick="hideCreateProject()">Cancel</button>
                            <button class="labels btn btn-primary" onclick="createProject()">Create</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="createRoomModal" style="display: none;">
                <div class="card">
                    <div class="title-card">Create Room</div>
                    
                    <div class="content-columns" style="justify-content: center;">
                        <div class="content-row">
                            <div class="labels">Room Name</div>
                            <input class="inputs" type="text" id="roomName">
                        </div>

                        <div class="content-row">
                            <button class="labels btn btn-danger" onclick="hideCreateRoom()">Cancel</button>
                            <button class="labels btn btn-primary" onclick="createRoom()">Create</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="OfflineScreen" style="display: none;">
                <div class="card">
                    <div class="title-card">ALERT</div>

                    <div class="content-columns">
                        <div class="img-sleep">
                            <img src="SleepWthoutBg.png" style="height: 100%; width: 100%; margin: 0px; padding: 0px;">
                        </div>

                        <div class="content-row">
                            <font color="Red" size="16px">Server Offline</font>
                        </div>
                    </div>
                </div>
            </div>

            <div id="Main" style="display: none; flex-direction: column;">

                <div class="card" id="savedProjects">
                    <div class="title-card">Saved Projects</div>

                    <div id="projects" class="content-columns">
                        <!--Projects generate in here later with loadProjects()-->
                    </div>
                </div>

                <div class="card" id="savedRooms">
                    <div class="title-card">Saved Rooms</div>

                    <div id="rooms" class="content-columns">
                        <!--Rooms generate in here later with loadProjects()-->
                    </div>
                </div>

            </div>
        </div>

        <script>
            
            waitForServer();
            checkAuth();

            async function loadProjects() {
                const res = await fetch(API + "/api/projects", {
                    credentials: "include"
                });

                const projects = await res.json();

                const container = document.getElementById("projects");
                container.innerHTML = "";

                const newProj = document.createElement("button");
                newProj.className = "btn btn-primary content-btn";
                newProj.onclick = () => {
                    document.getElementById("createProjectModal").style.display = "flex";
                    document.getElementById("Main").style.display = "none";
                };
                newProj.style.width = "95%"
                newProj.innerText = "New Project"
                container.appendChild(newProj)

                projects.forEach(p => {
                    const row = document.createElement("div");
                    row.className = "content-row";

                    const div = document.createElement("div");
                    div.className = "labels";
                    div.style.maxWidth = "90%"
                    div.style.width = "90%"
                    div.style.cursor = "pointer";
                    div.style.display = "flex";
                    div.style.flexDirection = "row";
                    div.style.justifyContent = "space-between";
                    div.id = "projectBtn";

                    div.onclick = () => {
                        localStorage.setItem("currentProject", JSON.stringify(p));
                        window.location.href = "index.html";
                    };

                    // Project name (clickable)
                    const name = document.createElement("span");
                    name.innerText = p.name;

                    // Delete button
                    const delBtn = document.createElement("button");
                    delBtn.innerText = "Delete";
                    delBtn.className = "btn btn-danger"
                    delBtn.style.marginLeft = "5px";

                    delBtn.onclick = async (e) => {
                        e.stopPropagation(); // 🚨 prevents triggering open

                        if (!confirm("Delete this project?")) return;

                        try {
                            const res = await fetch(API + "/api/projects/" + p.id, {
                                method: "DELETE",
                                credentials: "include"
                            });

                            if (!res.ok) throw new Error("Delete failed");

                            // Reload list after delete
                            loadProjects();

                        } catch (err) {
                            console.error(err);
                            alert("Failed to delete project");
                        }
                    };
                    
                    
                    div.appendChild(name);
                    div.appendChild(delBtn);
                    row.appendChild(div)
                    container.appendChild(row);
                });
            }
            loadProjects();

            async function loadRooms() {
                const res = await fetch(API + "/api/rooms", {
                    credentials: "include"
                });

                const rooms = await res.json();

                const container = document.getElementById("rooms");
                container.innerHTML = "";

                const newRoom = document.createElement("button");
                newRoom.className = "btn btn-primary content-btn";
                newRoom.onclick = () => {
                    document.getElementById("createRoomModal").style.display = "flex";
                    document.getElementById("Main").style.display = "none";
                };
                newRoom.style.width = "95%"
                newRoom.innerText = "New Room"
                container.appendChild(newRoom)

                rooms.forEach(p => {
                    const row = document.createElement("div");
                    row.className = "content-row";

                    const div = document.createElement("div");
                    div.className = "labels";
                    div.style.maxWidth = "90%"
                    div.style.width = "90%"
                    div.style.cursor = "pointer";
                    div.style.display = "flex";
                    div.style.flexDirection = "row";
                    div.style.justifyContent = "space-between";
                    div.id = "roomBtn";

                    div.onclick = () => {
                        localStorage.setItem("currentRoom", JSON.stringify(p));
                        window.location.href = "rooms.html";
                    };

                    // Project name (clickable)
                    const name = document.createElement("span");
                    name.innerText = p.name;

                    // Delete button
                    const delBtn = document.createElement("button");
                    delBtn.innerText = "Delete";
                    delBtn.className = "btn btn-danger"
                    delBtn.style.marginLeft = "5px";

                    delBtn.onclick = async (e) => {
                        e.stopPropagation(); // 🚨 prevents triggering open

                        if (!confirm("Delete this room?")) return;

                        try {
                            const res = await fetch(API + "/api/rooms/" + p.id, {
                                method: "DELETE",
                                credentials: "include"
                            });

                            if (!res.ok) throw new Error("Delete failed");

                            // Reload list after delete
                            loadRooms();

                        } catch (err) {
                            console.error(err);
                            alert("Failed to delete room");
                        }
                    };
                    
                    
                    div.appendChild(name);
                    div.appendChild(delBtn);
                    row.appendChild(div)
                    container.appendChild(row);
                });
            }
            loadRooms();

            function goAccounts() {
                window.location.href = "admin.html";
            }

            function hideCreateProject() {
                document.getElementById("createProjectModal").style.display = "none";
                document.getElementById("Main").style.display = "flex";
            }
            
            function hideCreateRoom() {
                document.getElementById("createRoomModal").style.display = "none";
                document.getElementById("Main").style.display = "flex";
            }

            async function createProject() {
                const name = document.getElementById("projectName").value
                const type = document.getElementById("projectType").value
                
                if (!name) {
                    alert("Please enter a name");
                    return;
                }

                try {
                    const data = {
                        cabinet_type: type,
                    };

                    await fetch(API + "/api/projects", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify({
                            name: name,
                            data
                        })
                    });

                    alert("Project created!");
                    localStorage.removeItem("currentProject");
                    localStorage.setItem("currentProject", JSON.stringify({name: name,data}))
                    window.location.href = "index.html";

                } catch (err) {
                    console.error(err);
                    alert("Error creating project");
                }
            }

            async function createRoom() {
                const name = document.getElementById("roomName").value
                
                if (!name) {
                    alert("Please enter a name");
                    return;
                }

                try {

                    await fetch(API + "/api/rooms", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: "include",
                        body: JSON.stringify({
                            name: name,
                            data
                        })
                    });

                    alert("Room created!");
                    localStorage.removeItem("currentRoom");
                    localStorage.setItem("currentRoom", JSON.stringify({name: name, projects: []}))
                    window.location.href = "rooms.html";

                } catch (err) {
                    console.error(err);
                    alert("Error creating room");
                }
            }

        </script>
    </body>
</html>
