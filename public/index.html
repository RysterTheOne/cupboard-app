<!DOCTYPE html>
<html>
    <head>

        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
        <script src="script.js"></script>

        <title>
            Main
        </title>

    </head>

    <body>

        <div class="top-bar fade-in">
            <div class="top-left" name="TopBtns">
                <button class="btn btn-primary" onclick="goDashboard()">Dashboard</button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right" name="TopBtns">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="center-class fade-in">
            <div id="OfflineScreen" style="display: none;">
                <div class="card">
                    <div class="title-card">ALERT</div>

                    <div class="content-columns">
                        <div class="img-sleep">
                            <img src="SleepWthoutBg.png" style="height: 100%; width: 100%; margin: 0px; padding: 0px;">
                        </div>

                        <div class="content-row">
                            <font color="Red" size="16px">Server Offline</font>
                        </div>
                    </div>
                </div>
            </div>

            <div id="Main" style="display: none;">
                
                <div class="card">

                    <div class="title-card">Measurements</div>
                    
                    <div class="content-columns">
                        <div class="content-row">
                            <div class="labels">Width</div>
                            <input type="text" class="inputs" id="width" value="700" onblur="init3D()">
                        </div>

                        <div class="content-row">
                            <div class="labels">Height</div>
                            <input type="text" class="inputs" id="height" value="1400" onblur="init3D()">
                        </div>

                        <div class="content-row">
                            <div class="labels">Depth</div>
                            <input type="text" class="inputs" id="depth" value="400" onblur="init3D()">
                        </div>

                        <div class="content-row">
                            <div class="labels">Thickness</div>
                            <input type="text" class="inputs" id="thickness" value="50" onblur="init3D()">
                        </div>
                        <div class="content-row">
                            <div class="labels">Shelves</div>
                            <input type="text" class="inputs" id="shelves" value="2" onblur="init3D()">
                        </div>

                        <div class="content-row">
                            <div class="labels">Back Thickness</div>
                            <input type="text" class="inputs" id="back" value="50" onblur="init3D()">
                        </div>

                        <div class="content-row">
                            <div class="labels">Wood Type</div>
                            <select class="inputs" id="wood_type" onblur="init3D()">
                                <option value="oak_type">Oak</option>
                                <option value="walnut_type">Walnut</option>
                                <option value="maple_type">Maple</option>
                                <option value="mahogany_type">Mahogany</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">

                    <div class="title-card">Cupboard Render</div>

                    <div class="content-columns" id="canvas-parent">
                        <div class="content-canvas" id="canvas-container">
                            <!--Canvas-->
                            <button class="fullscreen-btn" onclick="toggleFullscreen()">
                                ⛶
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card">

                    <div class="title-card">Cut List</div>

                    <div class="content-columns" id="cutList">
                        <!--Cut list-->
                    </div>
                </div>

            </div>
        </div>

        <script>
            checkAuth();
            
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            let projectType;

            let animationId;
            let scene, camera, renderer, controls;
            let parts = [];

            const textureLoader = new THREE.TextureLoader();

            const oakTexture = textureLoader.load("/textures/oak/WoodTxtr.png");
            const oakNorm = textureLoader.load("/textures/oak/WoodNormal.png");
            const oakRough = textureLoader.load("/textures/oak/WoodRoughness.png");
            
            const walnutTexture = textureLoader.load("/textures/walnut/WoodTxtr.png");
            const walnutNorm= textureLoader.load("/textures/walnut/WoodNormal.png");
            const walnutRough = textureLoader.load("/textures/walnut/WoodRoughness.png");

            const mapleTexture = textureLoader.load("/textures/maple/WoodTxtr.png");
            const mapleNorm= textureLoader.load("/textures/maple/WoodNormal.png");
            const mapleRough = textureLoader.load("/textures/maple/WoodRoughness.png");

            const mahoganyTexture = textureLoader.load("/textures/mahogany/WoodTxtr.png");
            const mahoganyNorm= textureLoader.load("/textures/mahogany/WoodNormal.png");
            const mahoganyRough = textureLoader.load("/textures/mahogany/WoodRoughness.png");
                
            async function waitForServer1() {
                let serverOnline = false
                new Promise(resolve => setTimeout(() => {
                    document.getElementById("OfflineScreen").style.display = "block";
                    document.getElementById("Main").style.display = "none";

                    document.getElementsByName("TopBtns").forEach(Btn => {
                        Btn.style.display = "none";
                    });
                }, 1000))
                while (serverOnline === false) {
                    await sleep(1000);
                    try {

                        const res = await fetch(API + "/status");

                        if (res.ok) {
                            serverOnline = true;
                            console.log(res)
                            document.getElementById("OfflineScreen").style.display = "none";
                            document.getElementById("Main").style.display = "block";

                            document.getElementsByName("TopBtns").forEach(Btn => {
                                Btn.style.display = "block";
                            });

                            loadProject();
                            init3D();
                            generateCutList();
                        }

                        if (!res.ok) {

                            document.getElementById("OfflineScreen").style.display = "block";
                            document.getElementById("Main").style.display = "none";

                        }
                        
                    } catch (err) {
                        console.log(err);
                        document.getElementById("OfflineScreen").style.display = "block";
                        document.getElementById("Main").style.display = "none";

                        document.getElementsByName("TopBtns").forEach(Btn => {
                            Btn.style.display = "none";
                        });
                    }
                }
            }
            waitForServer1();

            //Project Functions//
            function loadProject() {

                const raw = localStorage.getItem("currentProject");

                if (!raw) {
                    window.location.href = "dashboard.html";
                    return;
                }

                const obj = JSON.parse(raw);
                document.title = obj.name;

                const data = obj.data;
                const type = data.cabinet_type;
                projectType = type

                if (data.width) {
                    document.getElementById("width").value = data.width;
                    document.getElementById("height").value = data.height;
                    document.getElementById("depth").value = data.depth;
                    document.getElementById("thickness").value = data.thickness;
                    document.getElementById("shelves").value = data.shelves;
                    document.getElementById("back").value = data.back;
                    document.getElementById("wood_type").value = data.woodtype
                }
                
                saveProject();
            }

            async function saveProject() {
                const data = {
                    cabinet_type: projectType,
                    width: document.getElementById("width").value,
                    height: document.getElementById("height").value,
                    depth: document.getElementById("depth").value,
                    thickness: document.getElementById("thickness").value,
                    shelves: document.getElementById("shelves").value,
                    back: document.getElementById("back").value,
                    woodtype: document.getElementById("wood_type").value,
                };

                await fetch(API + "/api/projects", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify({
                        name: document.title,
                        data
                    })
                });

                localStorage.setItem("projectData", JSON.stringify({name: document.title, data}));
            }

            function init3D() {
                clearCabinet();
                const container = document.getElementById("canvas-container");
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0f172a);

                camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 0.5));

                const light = new THREE.DirectionalLight(0xffffff, 0.7);
                light.position.set(5,5,5);
                scene.add(light);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enablePan = false;

                buildCabinet();
                animate();
            }

            function clearCabinet() {

                // Stop animation loop if running
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }

                // Nothing to clear
                if (!scene) {
                    return;
                }

                // Dispose cabinet meshes/materials/geometries
                parts.forEach(part => {

                    scene.remove(part);

                    if (part.geometry) {
                        part.geometry.dispose();
                    }

                    if (part.material) {

                        if (Array.isArray(part.material)) {

                            part.material.forEach(material => {
                                material.dispose();
                            });

                        } else {

                            part.material.dispose();

                        }
                    }
                });

                // Clear parts array
                parts = [];

                // Dispose renderer
                if (renderer) {

                    renderer.dispose();

                    // Remove canvas from DOM
                    if (renderer.domElement) {
                        renderer.domElement.remove();
                    }
                }

                // Dispose controls
                if (controls) {
                    controls.dispose();
                }

                // Clear scene objects fully
                scene.traverse(object => {

                    if (object.geometry) {
                        object.geometry.dispose();
                    }

                    if (object.material) {

                        if (Array.isArray(object.material)) {

                            object.material.forEach(material => {
                                material.dispose();
                            });

                        } else {

                            object.material.dispose();

                        }
                    }
                });

                // Clean references
                scene = null;
                camera = null;
                renderer = null;
                controls = null;
            }

            function buildCabinet() {

                const W = document.getElementById("width").value / 1000;
                const H = document.getElementById("height").value / 1000;
                const D = document.getElementById("depth").value / 1000;
                const T = document.getElementById("thickness").value / 1000;
                const shelves = parseInt(document.getElementById("shelves").value);
                const wood = document.getElementById("wood_type").value;
                const backT = document.getElementById("back").value / 1000;

                addBox(T,H,D,-W/2+T/2,0,0,wood);
                addBox(T,H,D,W/2-T/2,0,0,wood);

                addBox(W,T,D,0,H/2-T/2,0,wood);
                addBox(W,T,D,0,-H/2+T/2,0,wood);

                addBox(W,H,backT,0,0,-D/2,wood);

                for(let i=1;i<=shelves;i++){
                    const y = -H/2 + (H/(shelves+1))*i;
                    addBox(W-2*T,T,D*0.95,0,y,0,wood);
                }

                updateCamera(W,H,D);
            }

            function addBox(w,h,d,x,y,z,woodtype){
                const geo = new THREE.BoxGeometry(w,h,d);
                let mat = ""
                if (woodtype === "oak_type") {
                    mat = new THREE.MeshStandardMaterial({

                        map: oakTexture,

                        roughnessMap: oakRough,
                        roughness: 1,

                        normalMap: oakNorm,
                    });
                };

                if (woodtype == "walnut_type") {
                    mat = new THREE.MeshStandardMaterial({

                        map: walnutTexture,

                        roughnessMap: walnutRough,
                        roughness: 1,

                        normalMap: walnutNorm,
                    });
                };

                if (woodtype == "maple_type") {
                    mat = new THREE.MeshStandardMaterial({

                        map: mapleTexture,

                        roughnessMap: mapleRough,
                        roughness: 1,

                        normalMap: mapleNorm,
                    });
                };

                if (woodtype == "mahogany_type") {
                    mat = new THREE.MeshStandardMaterial({

                        map: mahoganyTexture,

                        roughnessMap: mahoganyRough,
                        roughness: 1,

                        normalMap: mahoganyNorm,
                    });
                };
                
                const mesh = new THREE.Mesh(geo,mat);
                mesh.position.set(x,y,z);
                scene.add(mesh);
                parts.push(mesh);
            }

            function updateCamera(w,h,d){
                const max = Math.max(w,h,d);
                camera.position.set(max*2,max*1.5,max*2);
                controls.target.set(0,0,0);
                controls.update();
            }

            function updateCabinet(){
                buildCabinet();
            }

            function animate(){
                animationId = requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            //Cutlist Generation//
            function generateCutList(){
                const W = +width.value;
                const H = +height.value;
                const D = +depth.value;
                const T = +thickness.value;
                const shelvesVal = +document.getElementById("shelves").value;
                const backT = +back.value;

                const internalWidth = W - (2*T);

                const list = [
                    {name:"Side Panel",qty:2,w:D,h:H,t:T},
                    {name:"Top/Bottom",qty:2,w:W,h:D,t:T},
                    {name:"Back Panel",qty:1,w:W,h:H,t:backT}
                ];

                if(shelvesVal > 0){
                    list.push({name:"Shelf",qty:shelvesVal,w:internalWidth,h:D,t:T});
                }

                cutList.innerHTML = list.map(i =>
                    `<div class="content-row">
                        <div class="labels">${i.name}</div> <div class="inputs">${i.qty}x | ${i.w} × ${i.h} × ${i.t} mm</div>
                    </div>`
                ).join("");
            }

            //Href Functions//
            function goDashboard() {
                window.location.href = "dashboard.html"
            }

            //Canvas Fullscreen//
            function toggleFullscreen() {
                const elem = document.querySelector("#canvas-parent");

                if (!document.fullscreenElement) {
                    elem.requestFullscreen().then(() => {
                        resizeRenderer();
                    });
                } else {
                    document.exitFullscreen().then(() => {
                        resizeRenderer();
                    });
                }
            }

            function resizeRenderer() {
                const container = document.getElementById("canvas-container");

                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();

                renderer.setSize(container.clientWidth, container.clientHeight);
            }

            async function incrimentalSave() {
                while (true) {
                    await sleep(20000);
                    saveProject();
                    console.log("Saved");
                }
            }
            incrimentalSave();

        </script>
    </body>
</html>
