<!DOCTYPE html>
<html>
    <head>

        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
        <script src="script.js"></script>

        <title>
            Main
        </title>

    </head>

    <body>

        <div class="top-bar fade-in">
            <div class="top-left">
                <button class="btn btn-primary" onclick="goDashboard()">Dashboard</button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="center-class fade-in">

            <div class="card">

                <div class="title-card">Measurements</div>
                
                <div class="content-columns">
                    <div class="content-rows">
                        <div class="labels">Width</div>
                        <div class="labels">Height</div>
                        <div class="labels">Depth</div>
                        <div class="labels">Thickness</div>
                        <div class="labels">Shelves</div>
                        <div class="labels">Back Thickness</div>
                    </div>

                    <div class="content-rows">
                        <input type="text" class="inputs" id="width" value="700">
                        <input type="text" class="inputs" id="height" value="1400">
                        <input type="text" class="inputs" id="depth" value="400">
                        <input type="text" class="inputs" id="thickness" value="50">
                        <input type="text" class="inputs" id="shelves" value="2">
                        <input type="text" class="inputs" id="back" value="50">
                    </div>
                </div>
            </div>

            <div class="card">

                <div class="title-card">Cupboard Render</div>

                <div class="content-columns">
                    <div class="content-canvas" id="canvas-container">
                </div>
            </div>

            <div class="card">

                <div class="title-card">Cut List</div>

                <div class="content-columns" id="cutList"></div>
            </div>
        </div>

        <script>
            checkAuth();

            //Project Functions//
            function loadProject() {

                
                const raw = localStorage.getItem("currentProject");

                if (!raw) {
                    window.location.href = "dashboard.html";
                    return;
                }

                const obj = JSON.parse(raw);
                document.title = obj.name;

                const data = obj.data;
                const type = data.cabinet_type;

                //document.getElementById("width").value = 1;
                //document.getElementById("height").value = 1;
                //document.getElementById("depth").value = 1;
                //document.getElementById("thickness").value = 1;
                //document.getElementById("shelves").value = 1
                //document.getElementById("back").value = 1
            }
            loadProject();

            async function saveProject() {
                const data = {
                    name: projectName.value,
                    cabinet_type: type.value,
                };

                await fetch(API + "/api/projects", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    credentials: "include",
                    body: JSON.stringify({
                        cabinet_type: type,
                        data
                    })
                });

                localStorage.setItem("projectData", JSON.stringify({cabinet_type: type,data}));
                alert("Project saved");
            }

            //3D Engine Handling//
            let scene, camera, renderer, controls;
            let parts = [];

            function init3D() {
                const container = document.getElementById("canvas-container");
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0f172a);

                camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 0.5));

                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(5,5,5);
                scene.add(light);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enablePan = false;

                buildCabinet();
                animate();
            }

            function clearCabinet() {
                if(!parts) {
                    return;
                }

                parts.forEach(p => scene.remove(p));
                parts = [];
            }

            function buildCabinet() {
                clearCabinet();

                const W = document.getElementById("width").value / 1000;
                const H = document.getElementById("height").value / 1000;
                const D = document.getElementById("depth").value / 1000;
                const T = document.getElementById("thickness").value / 1000;
                const shelves = parseInt(document.getElementById("shelves").value);
                const backT = document.getElementById("back").value / 1000;

                addBox(T,H,D,-W/2+T/2,0,0);
                addBox(T,H,D,W/2-T/2,0,0);

                addBox(W,T,D,0,H/2-T/2,0);
                addBox(W,T,D,0,-H/2+T/2,0);

                addBox(W,H,backT,0,0,-D/2);

                for(let i=1;i<=shelves;i++){
                    const y = -H/2 + (H/(shelves+1))*i;
                    addBox(W-2*T,T,D*0.95,0,y,0);
                }

                updateCamera(W,H,D);
            }

            function addBox(w,h,d,x,y,z){
                const geo = new THREE.BoxGeometry(w,h,d);
                const mat = new THREE.MeshStandardMaterial({color:0x8b5a2b});
                const mesh = new THREE.Mesh(geo,mat);
                mesh.position.set(x,y,z);
                scene.add(mesh);
                parts.push(mesh);
            }

            function updateCamera(w,h,d){
                const max = Math.max(w,h,d);
                camera.position.set(max*2,max*1.5,max*2);
                controls.target.set(0,0,0);
                controls.update();
            }

            function updateCabinet(){
                buildCabinet();
            }

            function animate(){
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene,camera);
            }

            init3D();

            //Cutlist Generation//
            function generateCutList(){
                const W = +width.value;
                const H = +height.value;
                const D = +depth.value;
                const T = +thickness.value;
                const shelvesVal = +document.getElementById("shelves").value;
                const backT = +back.value;

                const internalWidth = W - (2*T);

                const list = [
                    {name:"Side Panel",qty:2,w:D,h:H,t:T},
                    {name:"Top/Bottom",qty:2,w:W,h:D,t:T},
                    {name:"Back Panel",qty:1,w:W,h:H,t:backT}
                ];

                if(shelves>0){
                    list.push({name:"Shelf",qty:shelvesVal,w:internalWidth,h:D,t:T});
                }

                cutList.innerHTML = list.map(i =>
                    `<div>${i.name} | ${i.qty}x | ${i.w} × ${i.h} × ${i.t} mm</div>`
                ).join("");
            }
            generateCutList();

            //Href Functions//
            function goDashboard() {
                window.location.href = "dashboard.html"
            }
        </script>
    </body>
</html>
