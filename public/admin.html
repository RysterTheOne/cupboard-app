<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <style>
        #users {
            flex-direction: column;
            align-items: center;
            background: rgba(21, 30, 43, 0.85);
            overflow-y: scroll;
            scrollbar-color: #888888 #00000000;
            padding: 5%;
            border-radius: 16px;
        }
    </style>

    <head>
        <title>Admin Panel</title>
    </head>

    <body>

        <div class="top-bar">
            <div class="top-left" id="TopBtns">
                <button class="btn btn-primary" onclick="goDashboard()">Dashboard</button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right" id="TopBtns">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="center-class fade-in">
            <div id="OfflineScreen" style="display: none;">
                <div class="card">
                    <div class="title-card">ALERT</div>

                    <div class="content-columns">
                        <div class="img-sleep">
                            <img src="SleepWthoutBg.png" style="height: 100%; width: 100%; margin: 0px; padding: 0px;">
                        </div>

                        <div class="content-row">
                            <font color="Red" size="16px">Server Offline</font>
                        </div>
                    </div>
                </div>
            </div>

            <div id="Main" style="display: none;">

                <div class="card" id="newUser">
                    <div class="title-card">New User</div>

                    <div class="content-columns">
                        <div class="content-row">
                            <div class="labels">Username</div>
                            <input class="inputs" type="text" id="newUsername">
                        </div>

                        <div class="content-row">
                            <div class="labels">Password</div>
                            <input class="inputs" type="password" id="newPass">
                        </div>

                        <div class="content-row">
                            <div class="labels">Admin</div>
                            <input class="inputs" type="checkbox" id="newAdmin">
                        </div>

                        <div class="content-row">
                            <button class="btn btn-primary content-btn" style="width: 95%;" onclick="createUser()">Add User</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="title-card">All Users</div>

                    <div class="content-columns" id="users">
                        <!--Users here-->
                    </div>
                </div>

            </div>
        </div>

        <script>
            
            waitForServer();
            checkAuth();

            /* ========================= */
            function goDashboard() {
                window.location.href = "dashboard.html";
            }

            /* ========================= */
            async function loadUsers() {
                const res = await fetch(API + "/api/admin/users", {
                    credentials: "include"
                });

                const users = await res.json();

                const container = document.getElementById("users");

                container.innerHTML = users.map(u => `
                    <div class="content-row">
                        <div class="labels" style="max-width: 90%; width: 90%; flex-direction: row; justify-content: space-between;">
                            <strong>${u.username}</strong>
                            
                            <span style="opacity:0.7;">
                                (${u.is_admin ? "Admin" : "User"})
                            </span>

                            <button class="btn btn-danger" onclick="deleteUser(${u.id})">Delete</button>
                        </div>
                    </div>
                `).join("");
            }

            /* ========================= */
            async function createUser() {
                await fetch(API + "/api/admin/users", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: newUsername.value,
                        password: newPass.value,
                        is_admin: newAdmin.checked
                    })
                });

                newUsername.value = "";
                newPass.value = "";
                newAdmin.checked = false;

                loadUsers();
            }

            /* ========================= */
            async function deleteUser(id) {
                if (!confirm("Delete this user?")) return;

                await fetch(API + "/api/admin/users/" + id, {
                    method: "DELETE",
                    credentials: "include"
                });

                loadUsers();
            }

            /* ========================= */
            async function logout() {
                await fetch(API + "/api/logout", {
                    method: "POST",
                    credentials: "include"
                });

                window.location.href = "login.html";
            }

            /* ========================= */
            loadUsers();

        </script>
    </body>
</html>
