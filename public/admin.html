<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <style>
        #users {
            flex-direction: column;
            align-items: center;
            background: rgba(21, 30, 43, 0.85);
            overflow-y: scroll;
            scrollbar-color: #888888 #00000000;
            padding: 5%;
            border-radius: 16px;
        }
    </style>

    <head>
        <title>Admin Panel</title>
    </head>

    <body>

        <div class="top-bar">
            <div class="top-left">
                <button class="btn btn-primary" onclick="goDashboard()">Dashboard</button>
            </div>

            <div class="top-center">
                <h1>Cupboard App</h1>
            </div>

            <div class="top-right">
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="center-class fade-in">

            <div class="card" id="newUser">
                <div class="title-card">New User</div>

                <div class="content-columns">
                    <div class="content-rows">
                        <div class="labels">Username</div>
                        <div class="labels">Password</div>
                        <div class="labels">Admin</div>
                    </div>

                    <div class="content-rows">
                        <input class="inputs" type="text" id="newUsername">
                        <input class="inputs" type="password" id="newPass">
                        <input class="inputs" type="checkbox" id="newAdmin">
                    </div>

                    <button class="btn btn-primary" onclick="createUser()">Add User</button>
                </div>
            </div>

            <div class="card">
                <div class="title-card">All Users</div>

                <div class="content-columns" id="users">
                    <!--Users here-->
                </div>
            </div>
        </div>

        <script>
            checkAuth();
            /* ========================= */
            function goDashboard() {
                window.location.href = "dashboard.html";
            }

            /* ========================= */
            async function loadUsers() {
                const res = await fetch(API + "/api/admin/users", {
                    credentials: "include"
                });

                const users = await res.json();

                const container = document.getElementById("users");

                container.innerHTML = users.map(u => `
                        <div class="labels">
                            <strong>${u.username}</strong>
                            <span style="opacity:0.7;">
                                (${u.is_admin ? "Admin" : "User"})
                            </span>

                            <button class="btn btn-danger" onclick="deleteUser(${u.id})">Delete</button>
                        </div>
                    `).join("");
            }

            /* ========================= */
            async function createUser() {
                await fetch(API + "/api/admin/users", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: newUsername.value,
                        password: newPass.value,
                        is_admin: newAdmin.checked
                    })
                });

                newUsername.value = "";
                newPass.value = "";
                newAdmin.checked = false;

                loadUsers();
            }

            /* ========================= */
            async function deleteUser(id) {
                if (!confirm("Delete this user?")) return;

                await fetch(API + "/api/admin/users/" + id, {
                    method: "DELETE",
                    credentials: "include"
                });

                loadUsers();
            }

            /* ========================= */
            async function logout() {
                await fetch(API + "/api/logout", {
                    method: "POST",
                    credentials: "include"
                });

                window.location.href = "login.html";
            }

            /* ========================= */
            loadUsers();
        </script>
    </body>
</html>
